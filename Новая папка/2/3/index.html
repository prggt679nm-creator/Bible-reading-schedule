<style>
/* Layout: one narrow column with three bottom tabs (Сегодня / График / План); progress is drawn as a shelf of book spines. */
:root{
  --bg:#EDF0EC; --surface:#F8FAF7; --ink:#17231D; --ink-2:#4C5E54; --line:#D3DAD2;
  --accent:#1F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --carry:#8F500C; --carry-soft:#F1E3CC; --spine:#C9D2CA;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1612; --surface:#17211B; --ink:#E5EDE7; --ink-2:#95A89C; --line:#263329;
    --accent:#6CC79A; --accent-ink:#0B1F14; --accent-soft:#1D3A2B;
    --carry:#E3A862; --carry-soft:#33260F; --spine:#2B382E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1612; --surface:#17211B; --ink:#E5EDE7; --ink-2:#95A89C; --line:#263329;
  --accent:#6CC79A; --accent-ink:#0B1F14; --accent-soft:#1D3A2B;
  --carry:#E3A862; --carry-soft:#33260F; --spine:#2B382E; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 104px;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.view{display:flex;flex-direction:column;gap:16px}
.view>*{min-width:0}

.hd{display:flex;flex-direction:column;gap:4px;padding-top:4px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
h1{margin:0;font:600 34px/1.1 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font:600 20px/1.2 var(--f-display);text-wrap:balance}
h3.mo{margin:8px 0 -6px;font:600 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.planline{color:var(--ink-2);font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.card.pad{padding:16px}
.card>.ch:first-child,.card>.dw:first-child .day{border-top:0}
.cardhd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 16px 12px}

.ch{display:flex;align-items:center;gap:6px;padding:6px 16px 6px 6px;border-top:1px solid var(--line)}
.ck{width:48px;height:48px;flex:none;border:0;background:none;display:grid;place-items:center;padding:0}
.ck i{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent;transition:background .12s,border-color .12s}
.ck[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nm{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;color:inherit;text-decoration:none;padding:8px 0}
.nm .t{font:600 18px/1.25 var(--f-display)}
.go{flex:none;color:var(--accent)}
.is-done .nm .t{color:var(--ink-2);font-weight:500}
.tag{font-size:12px;letter-spacing:.02em;line-height:1;padding:4px 8px;border-radius:99px;color:var(--carry);background:var(--carry-soft);white-space:nowrap}
.tag.now{color:var(--accent);background:var(--accent-soft)}
.tag.ok{color:var(--accent);background:var(--accent-soft)}

.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.warn{border-color:var(--carry);color:var(--carry)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}

.note{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:12px;background:var(--carry-soft);color:var(--ink)}
.note b{font-weight:600}
.note.ok{background:var(--accent-soft)}

.bar{height:8px;border-radius:99px;background:var(--spine);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.stat{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.stat b{font:600 22px var(--f-display);font-variant-numeric:tabular-nums}

.shelf{display:flex;flex-direction:column;gap:10px}
.shelf .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-bottom:4px}
.spines{display:flex;gap:1px;align-items:flex-end}
.sp{position:relative;height:34px;min-width:2px;flex-basis:0;background:var(--spine);border-radius:2px;overflow:hidden}
.sp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:calc(var(--f) * 100%);background:var(--accent)}
.sp.out{opacity:.4;background:transparent;border:1px dashed var(--ink-2)}
.sp.out::after{display:none}
.sp.cur{outline:2px solid var(--ink);outline-offset:1px}

.dw{border-top:1px solid var(--line)}
.day{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;padding:12px 16px;border:0;background:none;text-align:left;min-height:60px}
.day.today{background:var(--accent-soft)}
.dd{display:flex;flex-direction:column;gap:2px}
.dd b{font:600 22px/1 var(--f-display);font-variant-numeric:tabular-nums}
.dd span{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.lb{font-weight:500;min-width:0;overflow-wrap:anywhere}
.st{display:flex;align-items:center;justify-content:flex-end;color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.day.done .lb{color:var(--ink-2)}
.dayx{background:var(--bg);border-top:1px solid var(--line)}
.dayx .ch{border-top:1px solid var(--line)}
.dayx .ch:first-child{border-top:0}

.fld{display:flex;flex-direction:column;gap:6px}
.fld>label,.lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.inp{min-height:44px;width:100%;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:44px;border:0;background:none;padding:6px 8px;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.pre{min-height:52px;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:500}
.pre[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chk{display:flex;gap:12px;align-items:flex-start;min-height:44px}
.chk input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.pv{padding:12px 14px;border-radius:10px;background:var(--accent-soft);color:var(--ink);display:flex;flex-direction:column;gap:2px}
.pv b{font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}

.day.skipd .lb{color:var(--ink-2);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 4px 0 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-weight:500}
.chip button{border:0;background:none;min-width:36px;min-height:36px;font-size:20px;line-height:1;color:var(--ink-2);border-radius:99px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:52px;border:0;background:none;color:var(--ink-2);font-size:12px;padding:6px 4px;border-radius:10px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <main id="view" class="view" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Разделы">
  <div class="nav-in">
    <button data-a="tab" data-v="today"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10.5 5.3 8.5 4.8 5 4.8v13c3.5 0 5.5.5 7 1.7m0-13c1.5-1.2 3.5-1.7 7-1.7v13c-3.5 0-5.5.5-7 1.7m0-13v13"/></svg>Сегодня</button>
    <button data-a="tab" data-v="sched"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>График</button>
    <button data-a="tab" data-v="plan"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>План</button>
  </div>
</nav>

<script>
/* ---------- Data and schedule logic (pure) ---------- */
const BOOKS=[["Бытие",50],["Исход",40],["Левит",27],["Числа",36],["Второзаконие",34],["Иисус Навин",24],["Судьи",21],["Руфь",4],["1 Самуила",31],["2 Самуила",24],["1 Царей",22],["2 Царей",25],["1 Летопись",29],["2 Летопись",36],["Ездра",10],["Неемия",13],["Эсфирь",10],["Иов",42],["Псалмы",150],["Притчи",31],["Екклесиаст",12],["Песнь Соломона",8],["Исаия",66],["Иеремия",52],["Плач Иеремии",5],["Иезекииль",48],["Даниил",12],["Осия",14],["Иоиль",3],["Амос",9],["Авдий",1],["Иона",4],["Михей",7],["Наум",3],["Аввакум",3],["Софония",3],["Аггей",2],["Захария",14],["Малахия",4],["Матфея",28],["Марка",16],["Луки",24],["Иоанна",21],["Деяния",28],["Римлянам",16],["1 Коринфянам",16],["2 Коринфянам",13],["Галатам",6],["Ефесянам",6],["Филиппийцам",4],["Колоссянам",4],["1 Фессалоникийцам",5],["2 Фессалоникийцам",3],["1 Тимофею",6],["2 Тимофею",4],["Титу",3],["Филимону",1],["Евреям",13],["Иакова",5],["1 Петра",5],["2 Петра",3],["1 Иоанна",5],["2 Иоанна",1],["3 Иоанна",1],["Иуды",1],["Откровение",22]];
const key=(b,c)=>b*1000+c;
const bookOf=k=>Math.floor(k/1000);
const chOf=k=>k%1000;
/* [book, from, to] in approximate order of events */
const CHRONO=[[1,1,50],[18,1,42],[2,1,40],[3,1,27],[4,1,36],[5,1,34],[6,1,24],[7,1,21],[8,1,4],[9,1,31],[10,1,24],[13,1,29],[19,1,72],[11,1,11],[14,1,9],[22,1,8],[20,1,31],[21,1,12],[19,73,89],[11,12,22],[12,1,17],[14,10,28],[32,1,4],[29,1,3],[30,1,9],[28,1,14],[23,1,66],[33,1,7],[12,18,25],[14,29,36],[34,1,3],[36,1,3],[35,1,3],[24,1,52],[25,1,5],[31,1,1],[26,1,48],[27,1,12],[19,90,150],[15,1,10],[17,1,10],[37,1,2],[38,1,14],[16,1,13],[39,1,4],
[40,1,28],[41,1,16],[42,1,24],[43,1,21],[44,1,12],[59,1,5],[44,13,14],[48,1,6],[44,15,17],[52,1,5],[53,1,3],[44,18,18],[46,1,16],[47,1,13],[44,19,20],[45,1,16],[44,21,28],[49,1,6],[50,1,4],[51,1,4],[57,1,1],[58,1,13],[60,1,5],[54,1,6],[56,1,3],[61,1,3],[55,1,4],[65,1,1],[62,1,5],[63,1,1],[64,1,1],[66,1,22]];
const SCOPE_RANGE={all:[1,66],heb:[1,39],gr:[40,66]};
const _seq={};
function seqFor(scope,order){
  const id=scope+'|'+order; if(_seq[id])return _seq[id];
  const [lo,hi]=SCOPE_RANGE[scope]||SCOPE_RANGE.all; const out=[];
  if(order==='chrono'){
    for(const [b,a,z] of CHRONO){ if(b<lo||b>hi)continue; for(let c=a;c<=z;c++)out.push(key(b,c)); }
  }else{
    for(let b=lo;b<=hi;b++)for(let c=1;c<=BOOKS[b-1][1];c++)out.push(key(b,c));
  }
  return _seq[id]=out;
}
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayStr=()=>ymd(new Date());
const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)};
const diffDays=(a,b)=>dayNum(b)-dayNum(a);
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtD=(s,o)=>parseD(s).toLocaleDateString('ru-RU',o);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
function pluralRu(n,f){n=Math.abs(n)%100;const n1=n%10;if(n>10&&n<20)return f[2];if(n1>1&&n1<5)return f[1];if(n1===1)return f[0];return f[2]}
const chWord=n=>n+' '+pluralRu(n,['глава','главы','глав']);
function title(k){const b=bookOf(k);return BOOKS[b-1][1]===1?BOOKS[b-1][0]:BOOKS[b-1][0]+' '+chOf(k)}
function label(keys){
  const parts=[];let i=0;
  while(i<keys.length){
    const b=bookOf(keys[i]);let j=i;
    while(j+1<keys.length&&bookOf(keys[j+1])===b&&keys[j+1]===keys[j]+1)j++;
    const c1=chOf(keys[i]),c2=chOf(keys[j]);const nm=BOOKS[b-1][0];
    parts.push(BOOKS[b-1][1]===1?nm:nm+' '+(c1===c2?c1:c1+'–'+c2));
    i=j+1;
  }
  return parts.join(' · ');
}
function mkPlan(d,paceOverride){
  const seq=seqFor(d.scope,d.order);let i=seq.indexOf(d.startKey);if(i<0)i=0;
  const days=Math.min(1200,Math.max(1,Math.round(d.days)||365));
  const base=d.stretch?seq.length-i:seq.length;
  return {scope:d.scope,order:d.order,days,stretch:!!d.stretch,startDate:d.startDate,startKey:seq[i],pace:paceOverride||base/days,skips:[...new Set((d.skips||[]).filter(x=>x>=d.startDate))].sort()};
}
/* skipped days: no new chapters are scheduled on these dates, later days move forward */
function skipList(p){return Array.isArray(p.skips)?p.skips:[]}
function isSkippedDay(p,date){return date>=p.startDate&&skipList(p).includes(date)}
function dayIdx(p,date){
  const raw=diffDays(p.startDate,date);if(raw<0)return raw;
  let n=0;for(const s of new Set(skipList(p)))if(s>=p.startDate&&s<date)n++;
  return raw-n;
}
function nthOpenDate(p,from,n){
  let date=from,c=-1;
  for(let g=0;g<6000;g++){if(!isSkippedDay(p,date))c++;if(c>=n)return date;date=addDays(date,1)}
  return date;
}
function dateOfDay(p,k){return k<0?addDays(p.startDate,k):nthOpenDate(p,p.startDate,k)}
function derive(plan){
  const seq=seqFor(plan.scope,plan.order);let i=seq.indexOf(plan.startKey);if(i<0)i=0;
  const R=seq.slice(i),pace=plan.pace;
  const totalDays=Math.max(1,Math.ceil(R.length/pace-1e-9));
  const range=dd=>{
    const from=Math.min(R.length,Math.floor(dd*pace+1e-9));
    const to=dd>=totalDays-1?R.length:Math.min(R.length,Math.floor((dd+1)*pace+1e-9));
    return [from,Math.max(from,to)];
  };
  return {seq,R,pace,totalDays,range,endDate:dateOfDay(plan,totalDays-1)};
}
const SCOPE_NAME={all:'Вся Библия',heb:'Еврейские писания',gr:'Греческие писания'};
function planName(p){
  const du={1095:'за 3 года',730:'за 2 года',548:'за 1,5 года',365:'за год',270:'за 9 месяцев',180:'за 6 месяцев',90:'за 3 месяца',40:'за 40 дней'}[p.days]||('за '+p.days+' '+pluralRu(p.days,['день','дня','дней']));
  return SCOPE_NAME[p.scope]+' '+du+(p.order==='chrono'?', хронологически':'');
}
const fmtPace=p=>(Math.round(p*10)/10).toString().replace('.',',');
const PRESETS=[
  {n:'Вся Библия за год',scope:'all',order:'canon',days:365},
  {n:'Хронологически за год',scope:'all',order:'chrono',days:365},
  {n:'Вся Библия за 1,5 года',scope:'all',order:'canon',days:548},
  {n:'Вся Библия за 2 года',scope:'all',order:'canon',days:730},
  {n:'Вся Библия за 3 года',scope:'all',order:'canon',days:1095},
  {n:'Вся Библия за 9 месяцев',scope:'all',order:'canon',days:270},
  {n:'Вся Библия за 6 месяцев',scope:'all',order:'canon',days:180},
  {n:'Вся Библия за 3 месяца',scope:'all',order:'canon',days:90},
  {n:'Греческие писания за 40 дней',scope:'gr',order:'canon',days:40}
];
function href(k,mode){
  const ref=pad(bookOf(k))+String(chOf(k)).padStart(3,'0')+'001';
  const q='wtlocale=U&pub=nwtsty&bible='+ref;
  return mode==='app'?'jwlibrary:///finder?'+q:'https://www.jw.org/finder?'+q;
}
/*--UI--*/
/* ---------- State ---------- */
const $=s=>document.querySelector(s);
const LS_KEY='bible-schedule-v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return null}}
function lsSet(o){try{localStorage.setItem(LS_KEY,JSON.stringify(o))}catch(e){}}
function validSaved(o){
  const p=o&&o.plan;
  return !!(p&&SCOPE_RANGE[p.scope]&&(p.order==='canon'||p.order==='chrono')&&typeof p.pace==='number'&&p.pace>0&&/^\d{4}-\d\d-\d\d$/.test(p.startDate)&&typeof p.startKey==='number'&&Array.isArray(o.read));
}
function adopt(o){return {savedAt:o.savedAt||0,isDefault:false,plan:Object.assign({},o.plan,{skips:[...new Set((Array.isArray(o.plan.skips)?o.plan.skips:[]).filter(s=>/^\d{4}-\d\d-\d\d$/.test(s)))].sort()}),read:new Set(o.read.filter(Number.isFinite)),link:o.link==='app'?'app':'web'}}
function defaultState(){
  return {savedAt:0,isDefault:true,read:new Set(),link:'web',
    plan:mkPlan({scope:'all',order:'canon',days:365,stretch:false,startDate:todayStr(),startKey:key(1,1)})};
}
let S=(function(){const o=lsGet();return validSaved(o)?adopt(o):defaultState()})();
function ser(){return {v:1,savedAt:S.savedAt,plan:S.plan,read:[...S.read].sort((a,b)=>a-b),link:S.link}}
const remote={doc:null,timer:null,busy:false,dirty:false,on:false};
function touch(){S.savedAt=Date.now();S.isDefault=false;lsSet(ser());scheduleRemote()}
function scheduleRemote(){if(!remote.doc)return;clearTimeout(remote.timer);remote.timer=setTimeout(flush,900)}
async function flush(){
  if(remote.busy){remote.dirty=true;return}
  remote.busy=true;
  try{await remote.doc.set(ser())}catch(e){}
  remote.busy=false;
  if(remote.dirty){remote.dirty=false;scheduleRemote()}
}
async function initRemote(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    remote.doc=db.doc('data/users/'+id+'/progress');
    const snap=await remote.doc.get();
    const d=snap.exists?snap.data():null;
    remote.on=true;
    if(d&&validSaved(d)&&(S.isDefault||(d.savedAt||0)>S.savedAt)){S=adopt(d);lsSet(ser());render()}
    else if(!S.isDefault&&(!d||S.savedAt>(d.savedAt||0))){scheduleRemote();if(ui.tab==='plan')render()}
    else if(ui.tab==='plan')render();
  }catch(e){}
}

/* ---------- UI state ---------- */

const ICON_CHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function chRow(k,tag){
  const done=S.read.has(k),t=title(k);

/* ---------- Today ---------- */
function model(){
  const P=S.plan,D=derive(P),t=todayStr(),dd=dayIdx(P,t),skipped=isSkippedDay(P,t),vd=Math.max(0,dd);
  const [f,to]=D.range(vd);
  const carried=D.R.slice(0,f).filter(k=>!S.read.has(k));
  const own=skipped?[]:D.R.slice(f,to);
  let extra=[];
  if(ui.ahead>0&&!skipped){const to2=D.range(vd+ui.ahead)[1];extra=D.R.slice(to,Math.max(to,to2))}
  const readCount=D.R.reduce((n,k)=>n+(S.read.has(k)?1:0),0);
  return {P,D,t,dd,vd,skipped,carried,own,extra,readCount,nextKey:D.R.find(k=>!S.read.has(k))};
}
function shelf(m){
  const inPlan=new Set(m.D.R);const cnt={};
  for(const k of m.D.R)if(S.read.has(k))cnt[bookOf(k)]=(cnt[bookOf(k)]||0)+1;
  const curB=m.nextKey?bookOf(m.nextKey):0;
  const planCnt={};for(const k of m.D.R)planCnt[bookOf(k)]=(planCnt[bookOf(k)]||0)+1;
  const mk=(lo,hi)=>{let h='';for(let b=lo;b<=hi;b++){
    const n=BOOKS[b-1][1],inP=planCnt[b]||0;
    const fr=inP?(cnt[b]||0)/inP:0;
    h+='<i class="sp'+(inP?'':' out')+(b===curB?' cur':'')+'" style="flex-grow:'+(n+8)+';--f:'+fr.toFixed(3)+'" title="'+BOOKS[b-1][0]+': '+(cnt[b]||0)+' из '+inP+'"></i>';
  }return '<div class="spines" aria-hidden="true">'+h+'</div>'};
  return '<div class="shelf"><div><div class="lbl">Еврейские писания</div>'+mk(1,39)+'</div><div><div class="lbl">Греческие писания</div>'+mk(40,66)+'</div></div>';
}
function todayView(){
  const m=model(),P=m.P,D=m.D;
  const d=new Date();
  const complete=m.readCount===D.R.length;
  let h='<header class="hd"><div class="eyebrow">'+fmtD(m.t,{weekday:'long'})+'</div><h1>'+fmtD(m.t,{day:'numeric',month:'long'})+'</h1><p class="planline">'+planName(P)+(m.skipped?' · пропуск':m.dd>=0&&m.dd<D.totalDays?' · день '+(m.dd+1)+' из '+D.totalDays:'')+'</p></header>';
  if(m.dd<0){
    h+='<div class="note"><p><b>План начнётся '+fmtD(P.startDate,{day:'numeric',month:'long'})+'.</b> Ниже чтение первого дня, его можно прочитать заранее.</p><div class="row"><button class="btn pri" data-a="startNow">Начать сегодня</button></div></div>';
  }
  if(m.skipped&&!complete){
    h+='<div class="note ok"><p><b>Сегодня пропуск.</b> Новые главы не добавляются, график сдвинулся на день.</p><div class="row"><button class="btn" data-a="unskip" data-date="'+m.t+'">Вернуть день</button></div></div>';
  }
  const th=Math.max(6,Math.ceil(P.pace)*2);
  if(!complete&&m.carried.length>th){
    h+='<div class="note"><p><b>Накопилось '+chWord(m.carried.length)+'.</b> Их можно читать по частям или сдвинуть график: непрочитанное распределится заново, начиная с сегодняшнего дня.</p><div class="row"><button class="btn warn" data-a="rebase">Сдвинуть график</button></div></div>';
  }
  if(complete){
    h+='<div class="note ok"><p><b>План выполнен.</b> Все '+chWord(D.R.length)+' прочитаны. Новый план можно составить на вкладке «План».</p></div>';
  }else{
    const shown=ui.showAllCarried?m.carried:m.carried.slice(0,12);
    const rows=[];
    shown.forEach(k=>rows.push(chRow(k,'перенесено')));
    if(m.carried.length>shown.length)rows.push('<div class="foot"><button class="btn ghost" data-a="showCarried">Показать ещё '+(m.carried.length-shown.length)+' перенесённых</button></div>');
    m.own.forEach(k=>rows.push(chRow(k)));
    m.extra.forEach(k=>rows.push(chRow(k,'вперёд')));
    const vis=shown.concat(m.own,m.extra);
    const unreadVis=vis.filter(k=>!S.read.has(k)).length;
    const nxt=D.range(m.vd+1+ui.ahead);const nextLbl=!m.skipped&&nxt[0]<nxt[1]?label(D.R.slice(nxt[0],nxt[1])):'';
    h+='<section class="card" aria-label="Чтение на сегодня"><div class="cardhd"><h2>На сегодня</h2><span class="muted small">'+(vis.length?chWord(vis.length):'')+'</span></div>';
    if(!vis.length)h+='<div class="foot"><p class="muted">'+(m.skipped?'Сегодня без новых глав.':'Сегодня чтение не запланировано.')+'</p></div>';
    else h+=rows.join('');
    h+='<div class="foot">'+(unreadVis?'<button class="btn pri" data-a="allToday">Отметить всё прочитанным</button>':(m.skipped?'':'<span class="tag ok">Всё прочитано</span>'))+(m.dd>=0&&nextLbl?'<button class="btn" data-a="ahead">Добавить: '+nextLbl+'</button>':'')+'</div>'+(!m.skipped&&m.dd>=0&&m.dd<D.totalDays?'<div class="foot"><button class="btn ghost" data-a="skipToday">Пропустить сегодня</button></div>':'')+'</section>';
  }
  const pct=D.R.length?Math.round(m.readCount/D.R.length*100):0;
  const unreadAll=D.R.length-m.readCount;
  let fin='По графику закончите '+fmtD(D.endDate,{day:'numeric',month:'long',year:'numeric'})+'.';
  if(m.dd>=0&&m.carried.length&&!complete){
    const proj=nthOpenDate(P,m.t,Math.max(0,Math.ceil(unreadAll/P.pace-1e-9)-1));
    if(diffDays(D.endDate,proj)>0)fin+=' С учётом переносов: около '+fmtD(proj,{day:'numeric',month:'long',year:'numeric'})+'.';
  }
  h+='<section class="card pad stack" aria-label="Прогресс"><div class="stat"><span><b>'+m.readCount+'</b> <span class="muted">из '+D.R.length+' глав</span></span><b>'+pct+'%</b></div><div class="bar" role="progressbar" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pct+'%"></i></div>'+
    (m.nextKey?'<p class="small muted">Следующая глава: <b style="color:var(--ink)">'+title(m.nextKey)+'</b></p>':'')+shelf(m)+'<p class="small muted">'+fin+'</p></section>';
  return h;
}

/* ---------- Schedule ---------- */
function schedView(){
  const m=model(),P=m.P,D=m.D;
  let h='<header class="hd"><div class="eyebrow">График</div><h1>'+planName(P)+'</h1><p class="planline">'+fmtD(P.startDate,{day:'numeric',month:'long',year:'numeric'})+' — '+fmtD(D.endDate,{day:'numeric',month:'long',year:'numeric'})+' · '+fmtPace(P.pace)+' гл. в день</p></header>';
  let curMonth='',open='',cardOpen=false;
  const closeCard=()=>{if(cardOpen){h+='</section>';cardOpen=false}};
  let dd=0;
  for(let date=P.startDate,guard=0;date<=D.endDate&&guard<8000;date=addDays(date,1),guard++){
    const mo=cap(fmtD(date,{month:'long'}))+' '+date.slice(0,4);
    const sk=isSkippedDay(P,date);
    let keys=[],f=0,to=0;
    if(!sk){[f,to]=D.range(dd);if(f>=to){dd++;continue};keys=D.R.slice(f,to)}
    if(mo!==curMonth){closeCard();h+='<h3 class="mo">'+mo+'</h3><section class="card">';cardOpen=true;curMonth=mo}
    const isOpen=ui.openDay===date,isToday=date===m.t,past=date<m.t,canSkip=date>=m.t;
    const dateBox='<span class="dd"><b>'+date.slice(8)*1+'</b><span>'+fmtD(date,{weekday:'short'})+'</span></span>';
    if(sk){
      h+='<div class="dw"><button class="day skipd'+(isToday?' today':'')+'"'+(isToday?' id="d-today"':'')+' data-a="openDay" data-dd="'+date+'" aria-expanded="'+isOpen+'">'+dateBox+'<span class="lb">Пропуск</span><span class="st">'+(isToday?'<span class="tag now">сегодня</span>':'')+'</span></button>';
      if(isOpen)h+='<div class="dayx"><p class="small muted">В этот день новые главы не добавляются.</p><div class="foot"><button class="btn" data-a="unskip" data-date="'+date+'">Вернуть день</button></div></div>';
      h+='</div>';continue;
    }
    const rc=keys.filter(k=>S.read.has(k)).length;
    const all=rc===keys.length;
    let st='',cls='';
    if(all){st=ICON_CHECK;cls=' done'}
    else if(isToday)st=(rc?'<span class="small" style="margin-right:8px">'+rc+'/'+keys.length+'</span>':'')+'<span class="tag now">сегодня</span>';
    else if(past)st=(rc?'<span class="small" style="margin-right:8px;color:var(--carry)">'+rc+'/'+keys.length+'</span>':'')+'<span class="tag">не прочитано</span>';
    else st=rc?'<span class="small">'+rc+'/'+keys.length+'</span>':'';
    h+='<div class="dw"><button class="day'+cls+(isToday?' today':'')+'"'+(isToday?' id="d-today"':'')+' data-a="openDay" data-dd="'+date+'" aria-expanded="'+isOpen+'">'+dateBox+'<span class="lb">'+label(keys)+'</span><span class="st">'+st+'</span></button>';
    if(isOpen){
      h+='<div class="dayx">'+keys.map(k=>chRow(k)).join('')+((all&&!canSkip)?'':'<div class="foot">'+(all?'':'<button class="btn pri" data-a="dayAll" data-dd="'+dd+'">Отметить день прочитанным</button>')+(canSkip?'<button class="btn ghost" data-a="skipDay" data-date="'+date+'">Пропустить этот день</button>':'')+'</div>')+'</div>';
    }
    h+='</div>';
    dd++;
  }
  closeCard();
  return h;
}

    startDate:started?todayStr():P.startDate,

/* ---------- Render and events ---------- */
function render(tabChange){
  const y=window.scrollY;
  $('#view').innerHTML=ui.tab==='today'?todayView():ui.tab==='sched'?schedView():planView();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===ui.tab?'page':'false'));
  if(tabChange){const el=ui.tab==='sched'?$('#d-today'):null;if(el)el.scrollIntoView({block:'center'});else window.scrollTo(0,0)}
  else window.scrollTo(0,y);
}
function setSkip(date,on){
  const set=new Set(skipList(S.plan));if(on)set.add(date);else set.delete(date);
  S.plan=Object.assign({},S.plan,{skips:[...set].sort()});
  ui.ahead=0;touch();render();
}
function makeIcs(time){
  const [hh,mm]=time.split(':').map(Number),now=new Date();
  let d=todayStr();if(hh*60+mm<=now.getHours()*60+now.getMinutes())d=addDays(d,1);
  const z=n=>String(n).padStart(2,'0'),ds=d.replace(/-/g,'')+'T'+z(hh)+z(mm)+'00';
  const url=location.href.split('#')[0].replace(/^blob:|^file:.*/,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Bible schedule//RU','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:bible-reading-'+z(hh)+z(mm)+'@schedule','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z',
    'DTSTART:'+ds,'DURATION:PT15M','RRULE:FREQ=DAILY','SUMMARY:Чтение Библии','DESCRIPTION:Откройте график чтения.'+(url?' '+url:''),
    url?'URL:'+url:'','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Чтение Библии','TRIGGER:PT0S','END:VALARM','END:VEVENT','END:VCALENDAR'].filter(Boolean).join('\r\n')+'\r\n';
}
const A={
  tab(t){ui.tab=t.dataset.v;ui.openDay=null;ui.confirmReset=false;if(ui.tab==='plan')ui.draft=draftFromPlan();render(true)},
  toggle(t){const k=+t.dataset.k;if(S.read.has(k))S.read.delete(k);else S.read.add(k);touch();render()},
  allToday(){const m=model();m.carried.concat(m.own,m.extra).forEach(k=>S.read.add(k));touch();render()},
  ahead(){ui.ahead++;render()},
  showCarried(){ui.showAllCarried=true;render()},
  startNow(){S.plan=Object.assign({},S.plan,{startDate:todayStr()});touch();render()},
  rebase(){const m=model();if(!m.nextKey)return;S.plan=Object.assign({},S.plan,{startKey:m.nextKey,startDate:todayStr()});ui.ahead=0;ui.showAllCarried=false;touch();render()},
  openDay(t){const k=t.dataset.dd;ui.openDay=ui.openDay===k?null:k;render()},
  remind(){
    const v=ui.remTime||'20:00';try{localStorage.setItem('bible-rem-time',v)}catch(e){}
    const blob=new Blob([makeIcs(v)],{type:'text/calendar;charset=utf-8'}),u=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=u;a.download='chtenie-biblii.ics';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(u),4000);
  },
  skipToday(){setSkip(todayStr(),true)},
  skipDay(t){setSkip(t.dataset.date,true)},
  unskip(t){setSkip(t.dataset.date,false)},
  addSkip(){const v=ui.skipDate;if(!/^\d{4}-\d\d-\d\d$/.test(v)){ui.skipMsg='Выберите дату';render();return}if(v<todayStr()){ui.skipMsg='Можно пропускать только сегодняшний и будущие дни';render();return}ui.skipMsg='';ui.skipDate='';setSkip(v,true)},
  dayAll(t){const m=model(),[f,to]=m.D.range(+t.dataset.dd);m.D.R.slice(f,to).forEach(k=>S.read.add(k));touch();render()},
  preset(t){const p=PRESETS[+t.dataset.i];Object.assign(ui.draft,{scope:p.scope,order:p.order,days:p.days});render()},
  scope(t){ui.draft.scope=t.dataset.v;render()},
  order(t){ui.draft.order=t.dataset.v;render()},
  link(t){S.link=t.dataset.v==='app'?'app':'web';touch();render()},
  save(){
    const d=ui.draft;if(!/^\d{4}-\d\d-\d\d$/.test(d.startDate))d.startDate=todayStr();
    S.plan=mkPlan(d);if(!d.keepRead)S.read=new Set();
    ui.ahead=0;ui.showAllCarried=false;ui.openDay=null;touch();ui.tab='today';render(true);
  },
  resetAsk(){ui.confirmReset=true;render()},
  resetNo(){ui.confirmReset=false;render()},
  resetDo(){S.read=new Set();ui.confirmReset=false;touch();render()}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');
  if(!t)return;const f=A[t.dataset.a];if(f){e.preventDefault();f(t)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-days'){const v=parseInt(t.value,10);if(v>=1&&v<=1200){ui.draft.days=v;updatePreview()}}
});
document.addEventListener('change',e=>{
  const t=e.target;if(!ui.draft)return;
  if(t.id==='f-date'){if(t.value){ui.draft.startDate=t.value;updatePreview()}}
  else if(t.id==='f-book'){ui.draft.startKey=key(+t.value,1);render()}
  else if(t.id==='f-ch'){ui.draft.startKey=key(bookOf(ui.draft.startKey),+t.value);updatePreview()}
  else if(t.id==='f-stretch'){ui.draft.stretch=t.checked;updatePreview()}
  else if(t.id==='f-keep'){ui.draft.keepRead=t.checked}
  else if(t.id==='f-rem'){if(t.value)ui.remTime=t.value}
  else if(t.id==='f-skip'){ui.skipDate=t.value;ui.skipMsg=''}
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&todayStr()!==ui.day){ui.day=todayStr();ui.ahead=0;if(ui.tab!=='plan')render()}
});
render(true);
initRemote();

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>

</html>
